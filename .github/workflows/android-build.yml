# Builds the GymSync Android APK with EAS on every push to main.
#
# What it does:
#   1. Checks out the repo on an ubuntu-latest runner (Android builds do
#      not need macOS, and EAS does the heavy lifting in the cloud anyway).
#   2. Installs Node and project dependencies.
#   3. Runs `eas build --platform android --profile preview --non-interactive`,
#      which produces an APK (buildType "apk" in eas.json) and downloads it
#      into the runner with --output.
#   4. Uploads the APK as a workflow artifact named `gymsync-apk`, so it can
#      be downloaded from the Actions run page and installed on any phone.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   EXPO_TOKEN - an Expo access token (expo.dev > Account Settings > Access
#                Tokens). Authenticates the EAS CLI without an interactive
#                login. This is the ONLY secret this workflow needs: unlike
#                iOS, Android APK builds need no Apple or Play Store credentials.

name: Android APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK with EAS
        run: eas build --platform android --profile preview --non-interactive --output ./gymsync.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymsync-apk
          path: gymsync.apk
          if-no-files-found: error
